name: chatbot-ai-v2

services:
  # ─────────────────────────────────────────────
  #  SERVICE 1 : Base de données PostgreSQL 15
  # ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: nora_v2_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nora_db}
      POSTGRES_USER: ${POSTGRES_USER:-nora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nora_secret_password}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/encgm_training_dataset_inserts.sql:/docker-entrypoint-initdb.d/02-inserts.sql:ro
    ports:
      - "5432:5432"
    networks:
      - nora_v2_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nora_user} -d ${POSTGRES_DB:-nora_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  #  SERVICE 2 : Backend Flask (API REST)
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nora_v2_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nora_db}
      DB_USER: ${POSTGRES_USER:-nora_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nora_secret_password}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash}
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nora_v2_network
    volumes:
      - ./backend:/app

  # ─────────────────────────────────────────────
  #  SERVICE 3 : Frontend React (Nginx)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder             
    container_name: nora_v2_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0  
    ports:
      - "5173:5173"              
    environment:
      - VITE_USE_POLLING=true    
      - BACKEND_URL=http://backend:5000
      - VITE_API_URL=${VITE_API_URL:-}
    volumes:
      - ./frontend:/app          
      - /app/node_modules        
    depends_on:
      - backend
    networks:
      - nora_v2_network

  # ─────────────────────────────────────────────
  #  SERVICE 4 : Backend Admin Flask (Back-Office CRUD)
  #  🔐 Même BDD partagée, API séparée sur /api/admin/*
  # ─────────────────────────────────────────────
  backend_admin:
    build:
      context: ./backend_admin
      dockerfile: Dockerfile
    container_name: nora_v2_backend_admin
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nora_db}
      DB_USER: ${POSTGRES_USER:-nora_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nora_secret_password}
      AI_API_KEY: ${AI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-models/text-embedding-004}
      SECRET_KEY_ADMIN: ${SECRET_KEY_ADMIN:-change-me-admin}
      CORS_ORIGINS_ADMIN: ${CORS_ORIGINS_ADMIN:-http://localhost:5174}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATA_DIR: /app/data
      FLASK_ENV: ${FLASK_ENV:-production}
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nora_v2_network
    volumes:
      - ./backend_admin:/app
      # Partage des embeddings avec le backend public (régénération admin)
      - ./backend/data:/app/data

  # ─────────────────────────────────────────────
  #  SERVICE 5 : Frontend Admin React (port 5174)
  # ─────────────────────────────────────────────
  frontend_admin:
    build:
      context: ./frontend_admin
      dockerfile: Dockerfile
    container_name: nora_v2_frontend_admin
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5174
    ports:
      - "5174:5174"
    environment:
      - VITE_USE_POLLING=true
      - BACKEND_ADMIN_URL=http://backend_admin:5001
    volumes:
      - ./frontend_admin:/app
      - /app/node_modules
    depends_on:
      - backend_admin
    networks:
      - nora_v2_network

# ─────────────────────────────────────────────
#  VOLUMES & RÉSEAU
# ─────────────────────────────────────────────
volumes:
  postgres_data_v2:
    driver: local

networks:
  nora_v2_network:
    driver: bridge
